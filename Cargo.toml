[package]
name = "ma-tui"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A Linux terminal controller and local player for Music Assistant"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossterm = "0.29"
futures-util = "0.3"
parking_lot = "0.12"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sendspin = "=0.3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zune-jpeg = "0.5.15"

[profile.release]
lto = "thin"
strip = true

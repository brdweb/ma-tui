name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 3'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt, rust-docs

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Test release build input validation
        run: python3 tests/packaging_build_input.py

      - name: Build optimized release executable
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: cargo build --release --locked

      - name: Collect release build and toolchain notices
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python3 packaging/ci_build.py

      - name: Upload release build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ma-tui-release-build
          path: |
            dist/ci-build/ma-tui-release-build.tar.gz
            dist/ci-build/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  advisory-audit:
    name: RustSec advisory audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache audit build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cargo-audit-0.22.2

      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Fail directly on advisories, including on fork and Dependabot PRs.
      # Do not create issues or require a write-capable GitHub token.
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock

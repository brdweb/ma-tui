version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Retain the Sendspin client qualified for MA-TUI's stable integration.
      - dependency-name: sendspin
        versions: ['>0.3.7']
      # sendspin 0.3.7 exposes tokio-tungstenite 0.29 WebSocket types.
      - dependency-name: tokio-tungstenite
        versions: ['>=0.30.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
